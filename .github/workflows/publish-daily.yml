name: Publish Daily Article

on:
  schedule:
    - cron: "0 11,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: publish
        env:
          PUBLISH_ANYTIME: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/publish_due_articles.mjs
      - if: steps.publish.outputs.changed == 'true'
        run: |
          node scripts/build_sitemap.mjs
      - name: Commit published content
        if: steps.publish.outputs.changed == 'true'
        run: |
          if git diff --quiet; then
            echo "Publish step reported changes, but no file diff remained."
          else
            git config user.name "daily-publisher"
            git config user.email "actions@github.com"
            git add assets/content.js content/scheduled/articles.json content/scheduled/nutrient-articles.json sitemap.xml robots.txt
            git commit -m "Publish due approved article"
            git push
          fi
